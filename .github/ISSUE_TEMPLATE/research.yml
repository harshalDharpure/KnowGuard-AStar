name: Research idea / ablation
description: Propose an ablation, dataset, or protocol change
title: "[research] "
labels: ["research", "enhancement"]
body:
  - type: textarea
    id: hypothesis
    attributes:
      label: Hypothesis
      description: What do you expect to move ACC / turns / ECE?
    validations:
      required: true
  - type: textarea
    id: method
    attributes:
      label: Method
      description: Flags, models, dataset slice, controls
  - type: checkboxes
    id: impact
    attributes:
      label: Likely impact on paper claim
      options:
        - label: Changes headline ACC
        - label: Ablation only
        - label: Engineering / throughput only
